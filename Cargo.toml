[package]
name = "evalight"
version = "0.1.0"
edition = "2024"
description = "Create and work on Evalight projects from the terminal"
license = "MIT"
repository = "https://github.com/violetpurpleish/evalight"
readme = "README.md"
include = [
    "/LICENSE",
    "/README.md",
    "/cli/assets/workshop.tar.gz",
    "/cli/src/**",
    "/cli/templates/**",
    "/cli/tests/**",
    "/public/css/ui.css",
    "/src/evalight/templates/**",
    "/src/ui/**",
]

[[bin]]
name = "evalight"
path = "cli/src/main.rs"

[[test]]
name = "commands"
path = "cli/tests/commands.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
sha2 = "0.10"
tar = { version = "0.4", default-features = false }
tempfile = "3"
